name: Daily update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Allow manual trigger for admins only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            if (data.permission !== 'admin') {
              core.setFailed(
                `Manual runs are limited to repository admins. ${context.actor} has ${data.permission} permission.`
              );
            }

      - uses: actions/checkout@v4

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', '.tooling/home/.clojure/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - name: Prefetch dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if timeout 10m clojure -P -M:openmevzuat; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency prefetch failed on attempt $attempt, retrying..."
            fi
          done

          echo "Dependency prefetch failed after 3 attempts."
          exit 1

      - name: Install OpenVPN when configured
        shell: bash
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          OPENVPN_CONFIG_B64: ${{ secrets.OPENVPN_CONFIG_B64 }}
        run: |
          set -euo pipefail

          if [[ -z "${OPENVPN_CONFIG:-}" && -z "${OPENVPN_CONFIG_B64:-}" ]]; then
            echo "No OpenVPN config secret configured; skipping VPN install."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y openvpn

      - name: Connect OpenVPN when configured
        shell: bash
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          OPENVPN_CONFIG_B64: ${{ secrets.OPENVPN_CONFIG_B64 }}
          OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${OPENVPN_CONFIG:-}" && -z "${OPENVPN_CONFIG_B64:-}" ]]; then
            echo "No OpenVPN config secret configured; running without VPN."
            exit 0
          fi

          VPN_DIR="$RUNNER_TEMP/openvpn"
          mkdir -p "$VPN_DIR"
          chmod 700 "$VPN_DIR"

          if [[ -n "${OPENVPN_CONFIG_B64:-}" ]]; then
            printf '%s' "$OPENVPN_CONFIG_B64" | base64 --decode > "$VPN_DIR/client.ovpn"
          else
            printf '%s' "$OPENVPN_CONFIG" > "$VPN_DIR/client.ovpn"
          fi

          AUTH_ARGS=()
          if [[ -n "${OPENVPN_USERNAME:-}" || -n "${OPENVPN_PASSWORD:-}" ]]; then
            if [[ -z "${OPENVPN_USERNAME:-}" || -z "${OPENVPN_PASSWORD:-}" ]]; then
              echo "OPENVPN_USERNAME and OPENVPN_PASSWORD must both be set when VPN auth is used."
              exit 1
            fi

            printf '%s\n%s\n' "$OPENVPN_USERNAME" "$OPENVPN_PASSWORD" > "$VPN_DIR/auth.txt"
            AUTH_ARGS=(--auth-user-pass "$VPN_DIR/auth.txt")
          fi

          chmod 600 "$VPN_DIR/client.ovpn"
          [[ ! -f "$VPN_DIR/auth.txt" ]] || chmod 600 "$VPN_DIR/auth.txt"

          sudo openvpn \
            --config "$VPN_DIR/client.ovpn" \
            "${AUTH_ARGS[@]}" \
            --daemon \
            --writepid "$VPN_DIR/openvpn.pid" \
            --log "$VPN_DIR/openvpn.log"

          for attempt in {1..45}; do
            if sudo grep -q "Initialization Sequence Completed" "$VPN_DIR/openvpn.log"; then
              echo "OpenVPN connected."
              exit 0
            fi

            if [[ -f "$VPN_DIR/openvpn.pid" ]] && ! sudo pgrep -F "$VPN_DIR/openvpn.pid" >/dev/null 2>&1; then
              echo "OpenVPN exited before connecting."
              sudo tail -n 80 "$VPN_DIR/openvpn.log" || true
              exit 1
            fi

            sleep 2
          done

          echo "OpenVPN did not connect within timeout."
          sudo tail -n 80 "$VPN_DIR/openvpn.log" || true
          exit 1

      - name: Run OpenMevzuat update
        shell: bash
        env:
          OPENMEVZUAT_FETCH_ATTEMPTS: "6"
          OPENMEVZUAT_FETCH_DELAY_MS: "2500"
          OPENMEVZUAT_FETCH_BACKOFF_MS: "5000"
          OPENMEVZUAT_FETCH_MAX_BACKOFF_MS: "120000"
          OPENMEVZUAT_FETCH_CONNECT_TIMEOUT_MS: "60000"
          OPENMEVZUAT_FETCH_TIMEOUT_MS: "300000"
          OPENMEVZUAT_PREFLIGHT_ENABLED: "true"
          OPENMEVZUAT_PREFLIGHT_ATTEMPTS: "2"
          OPENMEVZUAT_CIRCUIT_BREAKER_FAILURES: "2"
          OPENMEVZUAT_SKIP_UNREACHABLE_SOURCES: "true"
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if timeout 30m clojure -M:openmevzuat update; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Update failed on attempt $attempt, retrying..."
            fi
          done

          echo "Update failed after 3 attempts."
          exit 1

      - name: Disconnect OpenVPN
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          VPN_DIR="$RUNNER_TEMP/openvpn"
          if [[ -f "$VPN_DIR/openvpn.pid" ]] && sudo pgrep -F "$VPN_DIR/openvpn.pid" >/dev/null 2>&1; then
            sudo kill "$(sudo cat "$VPN_DIR/openvpn.pid")" || true
            echo "OpenVPN disconnected."
          else
            echo "No OpenVPN process to disconnect."
          fi

      - name: Create pull request if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            BRANCH="update/$(date +%F)"
            git config user.name "openmevzuat-bot"
            git config user.email "openmevzuat-bot@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add data derived
            git commit -m "Update canonical legislation snapshot $(date +%F)"
            git push origin "$BRANCH"

            gh pr create \
              --title "Update legislation snapshot — $(date +%F)" \
              --body "Automated OpenMevzuat update from official public sources."
          else
            echo "No changes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
