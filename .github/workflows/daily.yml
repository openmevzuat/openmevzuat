name: Daily update

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Allow manual trigger for admins only
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });

            if (data.permission !== 'admin') {
              core.setFailed(
                `Manual runs are limited to repository admins. ${context.actor} has ${data.permission} permission.`
              );
            }

      - uses: actions/checkout@v4

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn', '.tooling/home/.clojure/deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: latest

      - name: Prefetch dependencies
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if timeout 10m clojure -P -M:openmevzuat; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Dependency prefetch failed on attempt $attempt, retrying..."
            fi
          done

          echo "Dependency prefetch failed after 3 attempts."
          exit 1

      - name: Run OpenMevzuat update
        shell: bash
        env:
          OPENMEVZUAT_FETCH_ATTEMPTS: "6"
          OPENMEVZUAT_FETCH_DELAY_MS: "2500"
          OPENMEVZUAT_FETCH_BACKOFF_MS: "5000"
          OPENMEVZUAT_FETCH_MAX_BACKOFF_MS: "120000"
          OPENMEVZUAT_FETCH_CONNECT_TIMEOUT_MS: "60000"
          OPENMEVZUAT_FETCH_TIMEOUT_MS: "300000"
          OPENMEVZUAT_PREFLIGHT_ENABLED: "true"
          OPENMEVZUAT_PREFLIGHT_ATTEMPTS: "2"
          OPENMEVZUAT_CIRCUIT_BREAKER_FAILURES: "3"
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if timeout 30m clojure -M:openmevzuat update; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              echo "Update failed on attempt $attempt, retrying..."
            fi
          done

          echo "Update failed after 3 attempts."
          exit 1

      - name: Create pull request if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            BRANCH="update/$(date +%F)"
            git config user.name "openmevzuat-bot"
            git config user.email "openmevzuat-bot@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add data derived
            git commit -m "Update canonical legislation snapshot $(date +%F)"
            git push origin "$BRANCH"

            gh pr create \
              --title "Update legislation snapshot — $(date +%F)" \
              --body "Automated OpenMevzuat update from official public sources."
          else
            echo "No changes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
